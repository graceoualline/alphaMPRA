# AlphaGenome finetuned on the boda-preprocessed CODA episomal MPRA, one mpra head per cell type
# on the shared encoder, all trained jointly (Malinois-style multi-task). Same hyperparameters as
# the single-task {K562,Hepg2,SKNSH}_alphampra.yaml runs, with a higher stage 2 epoch cap: early
# stopping and best-val checkpointing decide where it actually stops.
#
#   TIME=2-00:00:00 GPU_TYPE=h100 ./submit_training.sh multihead_alphampra.yaml

# Written by preprocess_malinois.py: 600bp flank-padded sequences, a split column, and reverse
# complements plus duplicated top rows already in train
data: /home/go274/scratch_pi_skr2/go274/manual_MPRA_models/alphaMPRA/malinois_all_data_filtered_revcomp_preprocessed.tsv
heads: [K562, HepG2, SKNSH]
model_name: episomal_alphampra_multihead

# Local copy of the all_folds weights, used to reload the best checkpoint for the test plot
base_checkpoint: /home/go274/scratch_pi_skr2/go274/coda_data/claude_playground/alphagenome_weights/all_folds
output_dir: /home/go274/scratch_pi_skr2/go274/manual_MPRA_models/alphaMPRA/multihead_episomal_alphampra

construct_length: 600

batch_size: 64
subset_frac: 1.0
seed: 42

# Stage 1: heads only, encoder frozen
num_epochs: 1
learning_rate: 0.001
weight_decay: 0.000001
early_stopping_patience: 5
val_eval_frequency: 4

# Stage 2: encoder + heads from stage 1's best checkpoint. Early stopping (5 epochs without a
# better val loss) is expected to end it well before the cap
second_stage_lr: 0.00001
second_stage_epochs: 50
gradient_accumulation_steps: 1

# jitted encoder + heads training loop (fast_train.py); required for multiple heads
fast_train: true
